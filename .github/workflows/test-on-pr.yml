name: Run Test

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_ref:
        description: Base revision for exact and performance comparisons
        required: false
        default: main

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  run-golden-record:
    # Trusted dispatch includes Git LFS and campus access for input preparation.
    runs-on: [self-hosted, itp-dispatch]
    # About an hour, so it runs nightly (nightly.yml), not in the merge queue.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.actor != 'github-merge-queue[bot]')
    # Includes three builds, golden cases, and dispatch/queue overhead.
    timeout-minutes: 150
    steps:
      - name: Checkout exact validation revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Run native golden comparisons on sCluster
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.event.before || inputs.base_ref || github.event.repository.default_branch }}
          SCI_DATA_BRANCH: ${{ github.head_ref || github.ref_name }}
          GITLAB_ACCESS_TOKEN: ${{ secrets.GITLAB_ACCESS_TOKEN }}
          SCI_OUT: ${{ runner.temp }}/golden-receipts
        run: ci/golden_record.sh "$BASE_REF"
      - name: Report golden outcomes
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/golden-receipts" ]; then
            for receipt in revisions.txt data-revision.txt checks.tsv performance_report.txt; do
              if [ -f "$RUNNER_TEMP/golden-receipts/$receipt" ]; then
                echo "### $receipt" >> "$GITHUB_STEP_SUMMARY"
                cat "$RUNNER_TEMP/golden-receipts/$receipt" >> "$GITHUB_STEP_SUMMARY"
              fi
            done
          fi
