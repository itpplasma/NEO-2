name: Run Test

on:
  push:
    branches:
      - main
      - master
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  run-golden-record:
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)

    env:
      CC: gcc
      CXX: g++
      FC: gfortran
      MPI_HOME: /usr

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python 3
        run: |
          python -m pip install --upgrade pip
          pip install numpy

      - name: Install apt packages
        uses: ./.github/actions/apt-packages
        with:
          # The stable reference build still needs these system libraries.
          packages: git cmake make ninja-build gcc g++ gfortran jq libopenblas-dev liblapack-dev libsuitesparse-dev libfftw3-dev libgsl-dev libhdf5-dev libnetcdf-dev libnetcdff-dev python3-dev libevent-dev libnuma-dev libhwloc-dev libnl-3-dev libnl-route-3-dev libltdl-dev openmpi-bin openmpi-common libopenmpi-dev

      - name: Ensure BLAS and MPI are properly configured
        run: |
          # Fallback installation to ensure pkg-config files are present
          sudo apt-get update
          sudo apt-get -o Dir::Cache::archives="$RUNNER_TEMP/neo2-apt-archives" \
            install -y --reinstall libopenblas-dev pkg-config
          sudo apt-get -o Dir::Cache::archives="$RUNNER_TEMP/neo2-apt-archives" \
            install -y --reinstall openmpi-bin openmpi-common libopenmpi-dev
          
          # Verify BLAS can be found
          pkg-config --exists openblas && echo "OpenBLAS pkg-config found" || echo "Warning: OpenBLAS pkg-config not found"
          
          # Verify MPI can be found
          pkg-config --exists ompi && echo "OpenMPI pkg-config found" || echo "Warning: OpenMPI pkg-config not found"
          which mpifort && echo "mpifort found at: $(which mpifort)" || echo "Warning: mpifort not found"
          
          # Set environment variables to help CMake
          echo "BLA_VENDOR=OpenBLAS" >> "$GITHUB_ENV"
          echo "MPI_HOME=/usr" >> "$GITHUB_ENV"

      - name: Set up Python 3
        run: |
          python -m pip install --upgrade pip
          pip install numpy

      - name: Clone test data
        id: data
        env:
          GITLAB_ACCESS_TOKEN: ${{ secrets.GITLAB_ACCESS_TOKEN }}
        run: |
          set -e

          TEMP_DIR=$(mktemp -d)
          cd "$TEMP_DIR"

          if [ ! -d "data" ]; then
            echo "Fetching test data..."
            git clone "https://oauth2:${GITLAB_ACCESS_TOKEN}@gitlab.tugraz.at/plasma/data.git"
          fi

          cd data
          echo "data_dir=$(pwd)" >> "$GITHUB_OUTPUT"
          
      - name: Install libneo python required by NEO-2 python
        run: pip install git+https://github.com/itpplasma/libneo.git@afa0e4243e5e3f3e41110960f19cd0f340834988

      - name: Install NEO-2 python
        run: |
          cd python
          pip install -e .

      - name: Test malformed golden output rejection
        run: python -m unittest discover -s TEST -p test_golden_hdf5_guard.py


      - name: Build NEO-2 (current version)
        id: build
        run: |
          make
          echo "neo2_par=$(pwd)/build/NEO-2-PAR/neo_2_par.x" >> "$GITHUB_OUTPUT"
          echo "neo2_ql=$(pwd)/build/NEO-2-QL/neo_2_ql.x" >> "$GITHUB_OUTPUT"

      - name: Build NEO-2 (reference version - latest stable release)
        id: build_reference_stable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Build reference version in temp directory
          REFERENCE_DIR=$(mktemp -d)
          cd "$REFERENCE_DIR"

          git clone https://github.com/itpplasma/NEO-2.git .

          # Get latest stable release tag from GitHub API. Authenticated with
          # the run's own GH_TOKEN: an anonymous curl call here shares the
          # unauthenticated 60 req/hour rate limit across every concurrent CI
          # run in the repo and starts failing under load.
          LATEST_RELEASE=$(curl -s -H "Authorization: Bearer ${GH_TOKEN}" \
            https://api.github.com/repos/itpplasma/NEO-2/releases/latest | jq -r '.tag_name')
          if [ -z "$LATEST_RELEASE" ] || [ "$LATEST_RELEASE" == "null" ]; then
            echo "Error: Failed to fetch the latest release tag from GitHub API." >&2
            exit 1
          fi
          echo "Building reference version from latest stable release: $LATEST_RELEASE"
          git checkout "$LATEST_RELEASE"

          # Synchronized versioning: build the released NEO-2 against the matching
          # libneo release tag (LIBNEO_GIT_TAG was deprecated in favour of LIBNEO_REF).
          echo "Using synchronized libneo ref: $LATEST_RELEASE"
          make LIBNEO_REF="$LATEST_RELEASE"

          echo "neo2_ql_stable=$(pwd)/build/NEO-2-QL/neo_2_ql.x" >> "$GITHUB_OUTPUT"
          echo "neo2_par_stable=$(pwd)/build/NEO-2-PAR/neo_2_par.x" >> "$GITHUB_OUTPUT"

      - name: Run golden record test against stable version (rough check)
        env:
          CURRENT_NEO2_PAR: ${{ steps.build.outputs.neo2_par }}
          REFERENCE_NEO2_PAR: ${{ steps.build_reference_stable.outputs.neo2_par_stable }}
          CURRENT_NEO2_QL: ${{ steps.build.outputs.neo2_ql }}
          REFERENCE_NEO2_QL: ${{ steps.build_reference_stable.outputs.neo2_ql_stable }}
          NEO2_BRANCH: ${{ github.head_ref || github.ref_name }}
          DATA_DIR: ${{ steps.data.outputs.data_dir }}
        id: run_test_stable
        continue-on-error: true
        run: |
          set -e

          TEST_DIR=TESTS/NEO-2/golden_record/

          cd "$DATA_DIR"

          git fetch origin
          if git ls-remote --exit-code --heads origin "$NEO2_BRANCH" > /dev/null; then
            echo "Checking out $NEO2_BRANCH"
            git checkout "$NEO2_BRANCH"
          else
            echo "Branch '$NEO2_BRANCH' not found in data. Falling back to main"
            git checkout main
          fi

          git pull
          source activate.sh
          git config lfs.fetchinclude "$TEST_DIR"
          git config lfs.fetchexclude ""
          git lfs pull
          git lfs checkout "$TEST_DIR"
          cd "$TEST_DIR"
          echo "test_dir=$(pwd)" >> "$GITHUB_OUTPUT"

          export TOL=1e-14
          export LEGACY_TOL=1e-10
          export MAGNETICS_TOL=1e-12
          make lorentz

          export TOL=1e-10
          export LEGACY_TOL=1e-8
          make ql

      - name: Upload test (against stable) output on failure
        if: steps.run_test_stable.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: golden-test-stable-output
          path: |
            ${{ steps.run_test_stable.outputs.test_dir }}/lorentz/current/summary.h5
            ${{ steps.run_test_stable.outputs.test_dir }}/lorentz/current/out
            ${{ steps.run_test_stable.outputs.test_dir }}/lorentz/reference/summary.h5
            ${{ steps.run_test_stable.outputs.test_dir }}/lorentz/reference/out
            ${{ steps.run_test_stable.outputs.test_dir }}/ql/current/summary.h5
            ${{ steps.run_test_stable.outputs.test_dir }}/ql/current/out
            ${{ steps.run_test_stable.outputs.test_dir }}/ql/reference/summary.h5
            ${{ steps.run_test_stable.outputs.test_dir }}/ql/reference/out

      - name: Build NEO-2 (reference version - main branch)
        if: github.event_name == 'pull_request'
        id: build_reference_main
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Build reference version from main branch for PR comparison
          REFERENCE_MAIN_DIR=$(mktemp -d)
          cd "$REFERENCE_MAIN_DIR"

          git clone https://github.com/itpplasma/NEO-2.git .

          echo "Building reference version at PR base $BASE_SHA"
          git checkout "$BASE_SHA"

          make

          {
            echo "neo2_ql_main=$(pwd)/build/NEO-2-QL/neo_2_ql.x"
            echo "neo2_par_main=$(pwd)/build/NEO-2-PAR/neo_2_par.x"
            echo "source_dir=$(pwd)"
          } >> "$GITHUB_OUTPUT"

      - name: Build the same NEO-2 source with the previous libneo pin
        if: github.event_name == 'pull_request'
        id: build_previous_libneo
        env:
          BASE_SOURCE: ${{ steps.build_reference_main.outputs.source_dir }}
        run: |
          set -euo pipefail
          OLD_REF=$(sed -n 's/^[[:space:]]*set(LIBNEO_REF \([^)]*\)).*/\1/p' "$BASE_SOURCE/COMMON/ProjectConfig.cmake.in")
          NEW_REF=$(sed -n 's/^[[:space:]]*set(LIBNEO_REF \([^)]*\)).*/\1/p' COMMON/ProjectConfig.cmake.in)
          test -n "$OLD_REF" && test -n "$NEW_REF"
          if [ "$OLD_REF" = "$NEW_REF" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The pre-repair pin cannot reconstruct current NEO-2: Fortio rejects
          # h5_copy from an open writer. Compare this transition against the
          # merged copy repair; subsequent bumps use their actual base pin.
          if [ "$OLD_REF" = 7262c32bf0406594a8ef27e84654d249aef2cb86 ]; then
            echo "Previous libneo $OLD_REF contains the known Fortio copy defect; using merged repair 1a5fb7ecd08f7a130793ebc67993de28521ee57a as the numerical baseline." >> "$GITHUB_STEP_SUMMARY"
            OLD_REF=1a5fb7ecd08f7a130793ebc67993de28521ee57a
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "NEO-2 $(git rev-parse HEAD), libneo $OLD_REF versus $NEW_REF" >> "$GITHUB_STEP_SUMMARY"
          PREVIOUS_DIR=$(mktemp -d)
          git archive HEAD | tar -x -C "$PREVIOUS_DIR"
          make -C "$PREVIOUS_DIR" LIBNEO_REF="$OLD_REF"
          echo "neo2_ql=$(realpath "$PREVIOUS_DIR/build/NEO-2-QL/neo_2_ql.x")" >> "$GITHUB_OUTPUT"
          echo "neo2_par=$(realpath "$PREVIOUS_DIR/build/NEO-2-PAR/neo_2_par.x")" >> "$GITHUB_OUTPUT"

      - name: Run golden record test against main version (exact check)
        if: github.event_name == 'pull_request'
        env:
          CURRENT_NEO2_PAR: ${{ steps.build.outputs.neo2_par }}
          REFERENCE_NEO2_PAR: ${{ steps.build_reference_main.outputs.neo2_par_main }}
          CURRENT_NEO2_QL: ${{ steps.build.outputs.neo2_ql }}
          REFERENCE_NEO2_QL: ${{ steps.build_reference_main.outputs.neo2_ql_main }}
        id: run_test_main
        continue-on-error: true
        run: |
          set -e
          cd ${{ steps.run_test_stable.outputs.test_dir }}

          export TOL=1e-14
          export LEGACY_TOL=1e-10
          export MAGNETICS_TOL=1e-12
          make lorentz

          export TOL=1e-15
          export LEGACY_TOL=1e-8
          make ql

      - name: Upload test (against main) output on failure
        if: steps.run_test_main.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: golden-test-main-output
          path: |
            ${{ steps.run_test_stable.outputs.test_dir }}/lorentz/current/summary.h5
            ${{ steps.run_test_stable.outputs.test_dir }}/lorentz/current/out
            ${{ steps.run_test_stable.outputs.test_dir }}/lorentz/reference/summary.h5
            ${{ steps.run_test_stable.outputs.test_dir }}/lorentz/reference/out
            ${{ steps.run_test_stable.outputs.test_dir }}/ql/current/summary.h5
            ${{ steps.run_test_stable.outputs.test_dir }}/ql/current/out
            ${{ steps.run_test_stable.outputs.test_dir }}/ql/reference/summary.h5
            ${{ steps.run_test_stable.outputs.test_dir }}/ql/reference/out

      - name: Run QL performance test
        if: github.event_name == 'pull_request'
        env:
          CURRENT_NEO2_QL: ${{ steps.build.outputs.neo2_ql }}
          REFERENCE_NEO2_QL: ${{ steps.build_reference_main.outputs.neo2_ql_main }}
        id: run_performance_test
        continue-on-error: true
        run: |
          set -e
          cd ${{ steps.run_test_stable.outputs.test_dir }}

          export TOL=1e-15
          make performance_ql

      - name: Upload performance test output on failure
        if: steps.run_performance_test.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: performance-test-output
          path: |
            ${{ steps.run_test_stable.outputs.test_dir }}/performance_ql/current/summary.h5
            ${{ steps.run_test_stable.outputs.test_dir }}/performance_ql/current/out
            ${{ steps.run_test_stable.outputs.test_dir }}/performance_ql/current/timing.txt
            ${{ steps.run_test_stable.outputs.test_dir }}/performance_ql/reference/summary.h5
            ${{ steps.run_test_stable.outputs.test_dir }}/performance_ql/reference/out
            ${{ steps.run_test_stable.outputs.test_dir }}/performance_ql/reference/timing.txt
            ${{ steps.run_test_stable.outputs.test_dir }}/performance_ql/performance_report.txt

      - name: Run (slow) par golden record test on pull request
        if: github.event_name == 'pull_request'
        env:
          CURRENT_NEO2_PAR: ${{ steps.build.outputs.neo2_par }}
        id: run_par_test
        continue-on-error: true
        run: |
          set -e
          cd ${{ steps.run_test_stable.outputs.test_dir }}

          export TOL=1e-15
          export LEGACY_TOL=4e-8
          make par

      - name: Upload par test output on failure
        if: steps.run_par_test.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: golden-test-par-output
          path: |
            ${{ steps.run_test_stable.outputs.test_dir }}/par/current/summary.h5
            ${{ steps.run_test_stable.outputs.test_dir }}/par/current/out

      - name: Report performance comparison
        if: always()
        run: |
          if [ -f "${{ steps.run_test_stable.outputs.test_dir }}/performance_ql/performance_report.txt" ]; then
            echo "## Performance Test Results" >> "$GITHUB_STEP_SUMMARY"
            cat "${{ steps.run_test_stable.outputs.test_dir }}/performance_ql/performance_report.txt" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Compare old and new libneo on the same NEO-2 source
        if: steps.build_previous_libneo.outputs.changed == 'true'
        id: run_libneo_comparison
        continue-on-error: true
        env:
          CURRENT_NEO2_PAR: ${{ steps.build.outputs.neo2_par }}
          REFERENCE_NEO2_PAR: ${{ steps.build_previous_libneo.outputs.neo2_par }}
          CURRENT_NEO2_QL: ${{ steps.build.outputs.neo2_ql }}
          REFERENCE_NEO2_QL: ${{ steps.build_previous_libneo.outputs.neo2_ql }}
          GOLDEN_DIR: ${{ steps.run_test_stable.outputs.test_dir }}
          GOLDEN_GUARD: ${{ github.workspace }}/ShellScripts/check_golden_hdf5.py
        run: |
          set -euo pipefail
          strict_script=$(mktemp)
          printf 'set -e -o pipefail\n' > "$strict_script"
          export BASH_ENV="$strict_script"
          make_strict() {
            make SHELL=/bin/bash '.SHELLFLAGS=-e -o pipefail -c' "$@"
          }
          # Compare both pins with the same PAR process count and launch options.
          cp "$GOLDEN_DIR/par/current/NEO2-all.sh" "$GOLDEN_DIR/par/reference/NEO2-all.sh"
          for case in lorentz ql par; do
            make_strict -C "$GOLDEN_DIR/$case/reference" clean
            rm -f "$GOLDEN_DIR/$case/reference/summary.h5"
            if [ "$case" = lorentz ]; then
              TOL=1e-14 MAGNETICS_TOL=1e-12 make_strict -C "$GOLDEN_DIR/$case" comparison
              tolerance=1e-14
            else
              TOL=1e-15 make_strict -C "$GOLDEN_DIR/$case" comparison
              tolerance=1e-15
            fi
            python "$GOLDEN_GUARD" "$GOLDEN_DIR/$case/reference/summary.h5" \
              "$GOLDEN_DIR/$case/current/summary.h5" "$tolerance"
          done

      - name: Upload libneo comparison output on failure
        if: steps.run_libneo_comparison.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: golden-libneo-comparison-output
          path: |
            ${{ steps.run_test_stable.outputs.test_dir }}/lorentz/*/summary.h5
            ${{ steps.run_test_stable.outputs.test_dir }}/lorentz/*/out
            ${{ steps.run_test_stable.outputs.test_dir }}/ql/*/summary.h5
            ${{ steps.run_test_stable.outputs.test_dir }}/ql/*/out
            ${{ steps.run_test_stable.outputs.test_dir }}/par/*/summary.h5
            ${{ steps.run_test_stable.outputs.test_dir }}/par/*/out

      - name: Fail the job on test failure
        if: steps.run_test_stable.outcome == 'failure' || steps.run_test_main.outcome == 'failure' || steps.run_par_test.outcome == 'failure' || steps.run_performance_test.outcome == 'failure' || steps.run_libneo_comparison.outcome == 'failure'
        run: exit 1
