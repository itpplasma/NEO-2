name: QL solver lab
on:
  push:
    branches: [feat/ql-moment-schur-20261101]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ql-solver-lab-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolated-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install isolated solver prerequisites
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends gfortran libblas-dev liblapack-dev ninja-build
      - name: Record exact public source
        run: |
          mkdir -p receipts
          git rev-parse HEAD > receipts/source-commit.txt
          git archive --format=tar.gz HEAD > receipts/source.tar.gz
          gfortran --version > receipts/compiler.txt
          lscpu > receipts/cpu.txt
      - name: Build and test reference kernels
        run: |
          set -o pipefail
          cmake -S TEST/moment_reduction -B build/solver-lab -G Ninja -DCMAKE_BUILD_TYPE=Release 2>&1 | tee receipts/configure.log
          cmake --build build/solver-lab --parallel 2 2>&1 | tee receipts/build.log
          ctest --test-dir build/solver-lab -V 2>&1 | tee receipts/tests.log
      - name: Upload reproducibility receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ql-solver-lab-${{ github.sha }}
          path: receipts/
          retention-days: 1
          if-no-files-found: error
  native-public-capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install native QL dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gfortran gcc g++ cmake ninja-build make autoconf automake libtool pkg-config libblas-dev liblapack-dev libsuitesparse-dev libgsl-dev libnetcdf-dev libnetcdff-dev libhdf5-dev libfftw3-dev libopenmpi-dev openmpi-bin
      - name: Instrument capture without changing discretization
        run: |
          mkdir -p native-receipts
          git rev-parse HEAD > native-receipts/source-commit.txt
          python3 TEST/solver_lab/capture_native.py --instrument | tee native-receipts/instrumentation.log
      - name: Build native QL and retain public runtime
        run: |
          set -o pipefail
          cmake -S . -B build/native -G Ninja -DCMAKE_BUILD_TYPE=Release 2>&1 | tee native-receipts/configure.log
          cmake --build build/native --target neo_2_ql.x --parallel 2 2>&1 | tee native-receipts/build.log
          mkdir -p native-receipts/runtime/lib native-receipts/runtime/usr/bin native-receipts/runtime/usr/share native-receipts/runtime/usr/lib/x86_64-linux-gnu native-receipts/runtime/include
          cp build/native/NEO-2-QL/neo_2_ql.x native-receipts/runtime/
          cp -L /usr/bin/orterun /usr/bin/orted native-receipts/runtime/usr/bin/
          cp -r /usr/share/openmpi native-receipts/runtime/usr/share/
          cp -r /usr/lib/x86_64-linux-gnu/openmpi /usr/lib/x86_64-linux-gnu/pmix2 native-receipts/runtime/usr/lib/x86_64-linux-gnu/
          cp /usr/include/suitesparse/umfpack*.h native-receipts/runtime/include/
          ldd build/native/NEO-2-QL/neo_2_ql.x > native-receipts/runtime/ldd.txt
          { ldd build/native/NEO-2-QL/neo_2_ql.x; ldd /usr/bin/orterun; ldd /usr/lib/x86_64-linux-gnu/openmpi/lib/openmpi3/mca_pmix_ext3x.so; ldd /usr/lib/x86_64-linux-gnu/openmpi/lib/openmpi3/mca_reachable_netlink.so; } | awk '/=> \/.* / {print $3}' | sort -u | while read lib; do cp -L "$lib" native-receipts/runtime/lib/; done
          tar --exclude='*.git*' -czf native-receipts/native-build.tar.gz build/native
      - name: Capture closed-orbit public kinetic systems
        run: |
          exe="$PWD/build/native/NEO-2-QL/neo_2_ql.x"
          root="$PWD"
          printf 'case\texit\n' > native-receipts/capture-status.tsv
          for entry in 'closed8 8 480 3 0 1' 'closed24 24 480 3 0 1' 'closed48 48 480 3 0 1' 'closed_highnu 24 480 3 0 100'; do
            read name eta steps lag bins scale <<< "$entry"
            dest="$root/native-receipts/$name"
            python3 TEST/solver_lab/capture_native.py --prepare "$dest" --eta "$eta" --steps "$steps" --lag "$lag" --density 1e13
            python3 - "$dest/neo2.in" "$bins" "$scale" <<'PY'
          import sys,re,hashlib
          from pathlib import Path
          p=Path(sys.argv[1]);text=p.read_text();scale=float(sys.argv[3])
          values={'isw_coul_log':'0','bin_split_mode':sys.argv[2],'nperiod':'2',
                  'conl_over_mfp_vec':f'{-2.8980601244164802e-6*scale:.16e}, {-4.7125144425366139e-6*scale:.16e}'}
          for key,value in values.items():
              text,n=re.subn(rf'(?im)^(\s*{key}\s*=)[^!\n]*',lambda m:m[1]+' '+value+' ',text)
              assert n==1,(key,n)
          p.write_text(text);p.with_name('final-input.sha256').write_text(hashlib.sha256(text.encode()).hexdigest()+'\n')
          PY
            set +e
            (cd "$dest" && /usr/bin/time -v env NEO2_CAPTURE=AX timeout 180 mpiexec --oversubscribe -n 2 "$exe" > capture.log 2>&1)
            result=$?
            set -e
            printf '%s\t%s\n' "$name" "$result" >> native-receipts/capture-status.tsv
          done
          test -s native-receipts/closed8/native_AX_0.bin && test -s native-receipts/closed8/native_AX_1.bin
      - name: Upload public operator data and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ql-native-public-${{ github.sha }}
          path: native-receipts/
          retention-days: 1
          if-no-files-found: error
