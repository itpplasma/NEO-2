name: Unit Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  merge_group:
  workflow_dispatch:
    inputs:
      libneo_ref:
        description: libneo branch, tag or commit to build against
        required: false
        default: ''

  push:
    branches:
      - main
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.event_name == 'workflow_dispatch' && github.run_id) || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","itp-build"]') }}
    if: >-
      github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.actor != 'github-merge-queue[bot]') || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-ci'))


    env:
      CC: gcc
      CXX: g++
      FC: gfortran
      MPI_HOME: /usr

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}

          fetch-depth: 0
          persist-credentials: false
      - name: Run native checks in the build container
        if: ${{ !github.event.pull_request.head.repo.fork }}
        env:
          SCI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          SCI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          SCI_LIBNEO_REF: ${{ inputs.libneo_ref }}
        run: |-
          ci/run.sh unit-tests-unit-tests
      - name: Install apt packages
        uses: ./.github/actions/apt-packages
        with:
          packages: git cmake make ninja-build gcc g++ gfortran jq libopenblas-dev liblapack-dev libfftw3-dev libgsl-dev python3-dev libevent-dev libnuma-dev libhwloc-dev libnl-3-dev libnl-route-3-dev libltdl-dev openmpi-bin openmpi-common libopenmpi-dev

        if: ${{ github.event.pull_request.head.repo.fork }}
      - name: Ensure BLAS and MPI are properly configured
        run: |
          # Fallback installation to ensure pkg-config files are present
          sudo apt-get update
          sudo apt-get -o Dir::Cache::archives="$RUNNER_TEMP/neo2-apt-archives" \
            install -y --reinstall libopenblas-dev pkg-config
          sudo apt-get -o Dir::Cache::archives="$RUNNER_TEMP/neo2-apt-archives" \
            install -y --reinstall openmpi-bin openmpi-common libopenmpi-dev

          # Verify BLAS can be found
          pkg-config --exists openblas && echo "OpenBLAS pkg-config found" || echo "Warning: OpenBLAS pkg-config not found"

          # Verify MPI can be found
          pkg-config --exists ompi && echo "OpenMPI pkg-config found" || echo "Warning: OpenMPI pkg-config not found"
          which mpifort && echo "mpifort found at: $(which mpifort)" || echo "Warning: mpifort not found"

          # Set environment variables to help CMake
          echo "BLA_VENDOR=OpenBLAS" >> "$GITHUB_ENV"
          echo "MPI_HOME=/usr" >> "$GITHUB_ENV"

        if: ${{ github.event.pull_request.head.repo.fork }}
      - name: Set up Python 3
        run: |
          python -m pip install --upgrade pip
          pip install numpy h5py scipy matplotlib

        if: ${{ github.event.pull_request.head.repo.fork }}
      - name: Build NEO-2
        env:
          LIBNEO_REF: ${{ inputs.libneo_ref }}
        run: |
          if [ -n "$LIBNEO_REF" ]; then
            make LIBNEO_REF="$LIBNEO_REF"
          else
            make
          fi

        if: ${{ github.event.pull_request.head.repo.fork }}
      - name: Run unit tests
        run: make test
        if: ${{ github.event.pull_request.head.repo.fork }}
