name: Unit Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  merge_group:
  workflow_dispatch:
    inputs:
      libneo_ref:
        description: libneo branch, tag or commit to build against
        required: false
        default: ''
  push:
    branches: [main]

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit-tests:
    runs-on: [self-hosted, itp-build]
    if: >-
      github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.actor != 'github-merge-queue[bot]')
    env:
      CC: gcc
      CXX: g++
      FC: gfortran
      MPI_HOME: /usr
    steps:
      - name: Checkout exact validation revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Run native unit checks in the build container
        env:
          SCI_LIBNEO_REF: ${{ inputs.libneo_ref }}
        run: ci/run.sh unit-tests-unit-tests
